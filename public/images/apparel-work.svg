<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1c1a12"/>
    </linearGradient>
    <linearGradient id="garmentWork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdf9e"/>
      <stop offset="100%" stop-color="#f4b942"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#bgWork)"/>
  <circle cx="60" cy="60" r="90" fill="#17b6c4" opacity="0.10"/>
  <circle cx="420" cy="260" r="90" fill="#17b6c4" opacity="0.10"/>

  <!-- Work apron -->
  <g transform="translate(170,55)">
    <path d="M20 0 L100 0 L100 20 L70 20 L70 40 L110 40 Q120 40 120 50 L120 180 Q120 190 110 190 L10 190 Q0 190 0 180 L0 50 Q0 40 10 40 L50 40 L50 20 L20 20 Z"
      fill="url(#garmentWork)" stroke="#8a5a10" stroke-width="3" stroke-linejoin="round"/>
    <!-- Pocket -->
    <rect x="25" y="90" width="70" height="55" rx="6" fill="#8a5a10" opacity="0.25" stroke="#8a5a10" stroke-width="2"/>
    <line x1="60" y1="90" x2="60" y2="145" stroke="#8a5a10" stroke-width="2" opacity="0.5"/>
    <!-- Neck strap -->
    <path d="M35 20 Q60 -20 85 20" fill="none" stroke="#8a5a10" stroke-width="4"/>
  </g>

  <!-- Toolbelt icon accent -->
  <g transform="translate(345,150)" opacity="0.9">
    <rect x="-18" y="-6" width="36" height="12" rx="4" fill="#17b6c4"/>
    <rect x="-6" y="-14" width="12" height="10" rx="2" fill="#0b1120"/>
  </g>

  <text x="240" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7fd7e0" letter-spacing="2">WORK UNIFORMS</text>
</svg>
