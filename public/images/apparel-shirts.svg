  </defs>
  <rect width="480" height="320" fill="url(#bgShirts)"/>
  <circle cx="400" cy="60" r="90" fill="#17b6c4" opacity="0.12"/>
  <circle cx="60" cy="280" r="110" fill="#17b6c4" opacity="0.10"/>

