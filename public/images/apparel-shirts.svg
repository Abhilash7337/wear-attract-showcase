  <g transform="translate(150,70)">
    <path d="M40 10 L80 0 L100 22 L86 40 L74 30 L74 150 Q74 160 64 160 L16 160 Q6 160 6 150 L6 30 L-6 40 L-20 22 L0 0 Z"
