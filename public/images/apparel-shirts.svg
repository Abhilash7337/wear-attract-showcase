    <path d="M40 10 L52 26 L40 40 L28 26 Z" fill="#0e7c88" opacity="0.35"/>
    <line x1="40" y1="46" x2="40" y2="150" stroke="#0e7c88" stroke-width="2" opacity="0.4"/>
    <circle cx="40" cy="64" r="3" fill="#0e7c88" opacity="0.5"/>
    <circle cx="40" cy="86" r="3" fill="#0e7c88" opacity="0.5"/>
    <circle cx="40" cy="108" r="3" fill="#0e7c88" opacity="0.5"/>
  </g>

